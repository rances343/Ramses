name: gaming-os
description: "Sistema operativo para juegos basado en Bazzite"
version: latest

base:
  image: ghcr.io/ublue-os/bazzite
  variant: stable

modules:
  - type: packages
    packages:
      - steam
      - lutris
      - heroic-games-launcher
      - goverlay
      - mangohud
      - gamemode
      - wine
      - winetricks
      - vulkan-tools
      - mesa-utils
      - kernel-fsync

  - type: systemd
    enable:
      - gamemode.service
      - system76-scheduler.service

  - type: files
    files:
      - source: configs/gamemode.ini
        destination: /etc/gamemode.ini
      - source: configs/sysctl.conf
        destination: /etc/sysctl.d/99-gaming.conf

  - type: ujust
    commands:
      - name: install-proton-ge
        description: "Instala Proton-GE"
        script: |
          mkdir -p ~/.steam/root/compatibilitytools.d
          cd ~/.steam/root/compatibilitytools.d
          wget https://github.com/GloriousEggroll/proton-ge-custom/releases/latest/download/GE-Proton.tar.gz
          tar -xzf GE-Proton.tar.gz
          rm GE-Proton.tar.gz

  - type: environment
    variables:
      GAMEMODERUN: 1
      MANGOHUD: 1
